<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Span </title>
    <style>
        table,tr,td,th{
            border: 1px solid black;
            border-collapse:collapse;
            caption-side:bottom;

        }
    </style>
</head>
<body>
    <table>
        <caption>Sample Table</caption>
        <tr>
            <td>abcd</td>
            <td>abcd</td>
            <td>abcd</td>
        </tr>
        <tr>
            <td>abcd</td>
            <td rowspan="2">abcd</td>
            <td>abcd</td>
        </tr>
        <tr>
            <td>abcd</td>
            
            <td>abcd</td>
        </tr>
        <tr>
            <td>abcd</td>
            <td>abcd</td>
            <td>abcd</td>
        </tr>                     
            <td>abcd</td>
            <td>abcd</td>   
            <td>abcd</td>
        </tr>
        <tr>
            <td>abcd</td>
            <td>abcd</td>
            <td>abcd</td>
        </tr>
    </table>
</body>
</html>
