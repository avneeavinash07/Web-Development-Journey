<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <style>
     table,tr,th,td{
           border: 1px solid black;
           border-collapse: collapse;
     }
  

    </style>
</head>
<body>

    <caption><b>Savings Table</b></caption>

    <table>
        <tr>
            <th><b>Month</b></th>
            <th><b>Saving</b></th>
        </tr>
        <tr>
            <td>january</td>
            <td>100</td>
        </tr>
        <tr>
            <td>february</td>
            <td>200</td>
        </tr>
        <tr>
            <td>march</td>
            <td>300</td>
        </tr>
        <tr>
            <td>april</td>
            <td>400</td>
        </tr>
    <tr>
        <td>Total</td>
        <td>800</td>
    </tr>
    </table>
</body>
</html>
